<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Carnet d'entraînement</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--acc:#ea6a1f;--ok:#16a34a;--gold:#d99a00}
@media(prefers-color-scheme:dark){:root{--bg:#111113;--card:#1c1c1f;--ink:#f4f4f5;--mut:#a1a1aa;--line:#2e2e33;--acc:#f58a46;--ok:#4ade80;--gold:#facc15}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
.unit{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.unit button{border:0;background:var(--card);color:var(--mut);padding:6px 12px;font-size:14px}
.unit button.on{background:var(--acc);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wk{margin:0 16px 8px;font-size:14px;font-weight:600}
.sess{margin:0 16px 8px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.sess b{font-size:22px;font-variant-numeric:tabular-nums}.sess small{display:block;color:var(--mut);font-size:12px}
.sess button{border:0;border-radius:10px;background:var(--acc);color:#fff;padding:10px 16px;font-weight:600;font-size:15px}
.last{margin:0 16px 8px;font-size:13px;color:var(--mut)}
.gc{display:block;margin:0 16px 12px;width:calc(100% - 32px);border:1px dashed var(--acc);background:transparent;color:var(--acc);border-radius:10px;padding:10px;font-size:14px;font-weight:600}
.ex{background:var(--card);border-radius:14px;margin:0 12px 12px;padding:12px;border:1px solid var(--line)}
.ex.ss{border-left:4px solid var(--acc)}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.top img{width:64px;height:62px;border-radius:8px;object-fit:cover;background:#fff;flex:0 0 auto}
.ex h3{margin:0;font-size:16px}.ex h3 span{color:var(--acc);margin-right:6px}
.meta{color:var(--mut);font-size:13px}
.tip{font-size:13px;background:rgba(234,106,31,.1);border-radius:8px;padding:6px 10px;margin-bottom:8px}
.cols,.row{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.cols{font-size:12px;color:var(--mut);text-align:center;margin-bottom:4px}
.row{margin-bottom:6px}
.row .n{color:var(--mut);font-size:14px;text-align:center}
.row input{width:100%;font-size:17px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
.row input:focus{outline:2px solid var(--acc);border-color:transparent}
.row.ok input{background:rgba(22,163,74,.16);border-color:var(--ok)}.row.red input{background:rgba(239,68,68,.18);border-color:#ef4444}
.row.red .n{color:#ef4444;font-weight:700}
.row.pr input{border-color:var(--gold);background:rgba(250,204,21,.15)}
.chk{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:20px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.acts{display:flex;gap:8px;margin:8px 0}
.acts button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px;font-size:13px}
.chart{margin:4px 0 8px;font-size:13px;color:var(--mut)}
input.note{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:9px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:16px 12px;padding:12px}
.card h2{font-size:16px;margin:0 0 8px}
.hi{font-size:14px;padding:6px 0;border-top:1px solid var(--line);color:var(--mut)}.hi b{color:var(--ink)}
.del{float:right;border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:8px;padding:2px 10px;font-size:13px}
.dg{width:100%;border:1px solid #ef4444;background:transparent;color:#ef4444;border-radius:10px;padding:10px;font-size:14px;font-weight:600;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.line{display:flex;gap:8px;margin:8px 0}
.line input{flex:1;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{width:100%;height:110px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px}
.bar button{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;background:var(--acc);color:#fff}
.bar button.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:14px 16px;font-size:15px}
#timer{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:12px 28px;border-radius:30px;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;z-index:25}
.warn{display:none;position:sticky;top:env(safe-area-inset-top);z-index:7;margin:0 12px 8px;background:var(--acc);color:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.warn p{margin:0 0 8px;font-weight:600}.warn div{display:flex;gap:8px}
.warn button{flex:1;border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:600;background:#fff;color:#18181b}.warn button.g{background:transparent;color:#fff;border:1px solid #fff}
.cheer{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(.9);background:var(--acc);color:#fff;padding:22px 26px;border-radius:22px;font-size:28px;font-weight:800;text-align:center;line-height:1.2;max-width:86%;z-index:30;box-shadow:0 10px 40px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}.cheer.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:6;max-width:90%;text-align:center}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:380px;text-align:center}
.box h2{margin:0 0 10px;font-size:22px}.box p{margin:6px 0;font-size:15px}.box button{margin-top:14px;width:100%;border:0;border-radius:12px;padding:14px;background:var(--acc);color:#fff;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div id="timer"></div>
<header><h1>Carnet d'entraînement</h1><div class="unit"><button id="ulb">lb</button><button id="ukg">kg</button></div></header>
<div class="tabs" id="tabs"></div>
<div class="warn" id="warn"><p id="wm"></p><div><button id="wend">Terminer la séance</button><button class="g" id="wgo">Je continue</button></div></div>
<div class="wk" id="wk"></div>
<div class="sess"><div><small>Durée de la séance</small><b id="sv">00:00</b></div><button id="sb">Démarrer la séance</button></div>
<div class="last" id="last"></div>
<button class="gc" id="gcopy">Reprendre les poids de la dernière séance</button>
<div id="list"></div>

<div class="card"><h2>Historique</h2><div id="hist"></div><button class="dg" id="cb">Effacer tout l'historique</button><textarea id="exp" readonly style="display:none;margin-top:8px"></textarea></div>

<div class="card"><h2>Poids corporel</h2>
<div class="line"><input id="bw" type="number" inputmode="decimal" step="any" placeholder="Poids du jour"><button class="btn p" id="badd">Ajouter</button></div>
<div id="bodyinfo" class="meta"></div><div class="chart" id="bodychart"></div>
<button class="btn" id="bundo">Annuler la dernière entrée</button></div>

<div class="card"><h2>Sauvegarde et réglages</h2>
<div class="line"><button class="btn" id="bexpall">Exporter tout</button><button class="btn" id="bimp">Importer</button></div>
<textarea id="bk" placeholder="L'export apparaît ici. Pour restaurer : colle ton texte ici, puis appuie sur Importer."></textarea>
<div class="line"><input id="nm" type="text" placeholder="Ton prénom (pour les encouragements)" maxlength="30"></div>
<div class="line"><button class="btn" id="rt" style="flex:1"></button></div>
<div class="line"><button class="btn" id="sn" style="flex:1"></button></div></div>

<div class="toast" id="toast"></div>
<div class="ov" id="ov"><div class="box"><h2 id="ovh"></h2><div id="ovb"></div><button id="ovx">Fermer</button></div></div>
<div class="bar"><button class="sec" id="bexp">Copier la séance</button><button id="bend">Terminer la séance</button></div>

const KEY="carnet-v1";
let mem=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem||{unit:"lb",cur:{},hist:[]}}
let S=load();S.cur=S.cur||{};S.hist=S.hist||[];S.notes=S.notes||{};S.body=S.body||[];if(!S.unit)S.unit="lb";
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const r1=x=>Math.round(x*10)/10;
function conv(v,f,t){v=+v;f=f||"lb";if(f===t)return v;return f==="kg"?v*2.20462:v/2.20462}
function fmt(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,"0");return (h?h+":":"")+p(m)+":"+p(s)}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2400)}
let day=0,pend=null,idleEnd=0;const IDLE=20*60000;const open={};
const CHEERS=["Bien joué 💪","Solide, continue !","Une série de plus dans la poche","Tu gères !","Belle exécution 🔥","Chaque rep compte"];

function lastFor(d,i){for(let k=S.hist.length-1;k>=0;k--){const h=S.hist[k];if(h.day===d&&h.data&&h.data[i]&&h.data[i].some(s=>s.w))return{h,sets:h.data[i]}}return null}
function bestPrev(d,i){let b=null;S.hist.forEach(h=>{if(h.day!==d||!h.data||!h.data[i])return;h.data[i].forEach(s=>{if(s.w){const v=conv(s.w,h.unit,S.unit);if(b===null||v>b)b=v}})});return b}
function repMax(str){return +String(str).split("-").pop()}
function getSets(d,i,n){S.cur[d]=S.cur[d]||{};let a=S.cur[d][i];if(!a){a=S.cur[d][i]=Array.from({length:n},()=>({w:"",r:"",done:false}))}return a}

function isRed(i,k,s){if(S.red===false)return false;const lf=lastFor(day,i);const p=lf&&lf.sets[k];if(!p||!p.w||s.w===""||isNaN(+s.w)||isNaN(+p.w))return false;if(s.c&&s.r==="")return false;return conv(s.w,S.unit,"lb")<=conv(p.w,lf.h.unit,"lb")+2.5+1e-6}
function isPR(i,s){const b=bestPrev(day,i);return b!==null&&s.w!==""&&s.r!==""&&+s.w>b+1e-6}
function isUp(i,k,s){const lf=lastFor(day,i);const p=lf&&lf.sets[k];return !!(p&&p.w&&s.w!==""&&conv(s.w,S.unit,"lb")>conv(p.w,lf.h.unit,"lb")+2.5+1e-6)}
function suggestion(i,reps){const lf=lastFor(day,i);if(!lf)return"";const f=lf.sets.filter(s=>s.w&&s.r);if(!f.length)return"";const top=repMax(reps);const mw=Math.max(...f.map(s=>conv(s.w,lf.h.unit,S.unit)));const step=S.unit==="lb"?5:2.5;
 return f.every(s=>+s.r>=top)?`💡 Tu as atteint ${top} reps partout : essaie ${r1(mw+step)} ${S.unit}`:`🎯 Vise ${top} reps sur toutes les séries à ${r1(mw)} ${S.unit}, puis augmente`}
function pts(d,i){const o=[];S.hist.forEach(h=>{if(h.day!==d||!h.data||!h.data[i])return;const w=h.data[i].filter(s=>s.w).map(s=>conv(s.w,h.unit,S.unit));if(w.length)o.push({y:Math.max(...w),d:String(h.date).slice(5)})});return o}
function chart(p,unit){
 if(p.length<2)return'<div>Il faut au moins 2 points pour voir la courbe.</div>';
 const W=300,H=110,P=24;const ys=p.map(a=>a.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}
 const X=i=>P+i*(W-2*P)/(p.length-1),Y=v=>H-P-(v-mn)*(H-2*P)/(mx-mn);
 return`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${p.map((a,i)=>X(i)+","+Y(a.y)).join(" ")}" style="fill:none;stroke:var(--acc);stroke-width:2"/>${p.map((a,i)=>`<circle cx="${X(i)}" cy="${Y(a.y)}" r="3.5" style="fill:var(--acc)"/>`).join("")}<text x="${P}" y="12" font-size="10" style="fill:var(--mut)">max ${r1(mx)} ${unit}</text><text x="${P}" y="${H-4}" font-size="10" style="fill:var(--mut)">${p[0].d}</text><text x="${W-P}" y="${H-4}" font-size="10" text-anchor="end" style="fill:var(--mut)">${p[p.length-1].d}</text></svg>`}

function et(x){return x.ts||new Date(x.date+"T00:00:00").getTime()}
function wkStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
function weekText(){const cs=wkStart(Date.now());let n=0;const set=new Set();S.hist.forEach(x=>{const t=et(x);if(isNaN(t))return;const s=wkStart(t);set.add(s);if(s===cs)n++});
 let s=set.has(cs)?cs:wkStart(cs-43200000),st=0;while(set.has(s)){st++;s=wkStart(s-43200000)}
 if(!S.hist.length)return"💪 Ta première séance t'attend. Le plus dur, c'est de commencer.";
 return`🔥 ${n} séance${n>1?"s":""} cette semaine · ${S.hist.length} au total`+(st>=2?` · ${st} semaines de suite`:"")}

function render(){
 $("ulb").className=S.unit==="lb"?"on":"";$("ukg").className=S.unit==="kg"?"on":"";
 $("tabs").innerHTML=DAYS.map((d,i)=>`<button class="${i===day?"on":""}" data-d="${i}">${d.name}</button>`).join("");
 const ls=S.hist.filter(h=>h.day===day).pop();
 $("last").textContent=ls?"Dernière séance : "+ls.date:"Aucune séance enregistrée pour ce jour";
 $("wk").textContent=weekText();
 $("gcopy").style.display=ls?"block":"none";
 $("nm").value=S.name||"";$("sn").textContent="Son de fin de repos : "+(S.snd===false?"désactivé":"activé");$("rt").textContent="Lignes rouges : "+(S.red===false?"désactivées":"activées");
 $("list").innerHTML=DAYS[day].ex.map((e,i)=>{
  const[lab,name,n,reps,rest,tempo,ss]=e;const sets=getSets(day,i,n);const lf=lastFor(day,i);const sg=suggestion(i,reps);const bp=bestPrev(day,i);
  const rows=sets.map((s,k)=>{const p=lf&&lf.sets[k]?lf.sets[k]:null;const pr=isPR(i,s);
   return`<div class="row${isRed(i,k,s)?" red":""}${pr?" pr":""}${s.done?" ok":""}"><div class="n">${pr?"🏆":k+1}</div>
   <input type="number" inputmode="decimal" step="any" placeholder="${p&&p.w?r1(conv(p.w,lf.h.unit,S.unit)):S.unit}" value="${s.w}" data-i="${i}" data-k="${k}" data-f="w">
   <input type="number" inputmode="numeric" placeholder="${p&&p.r?p.r:reps}" value="${s.r}" data-i="${i}" data-k="${k}" data-f="r">
   <button class="chk ${s.done?"on":""}" data-i="${i}" data-k="${k}">✓</button></div>`}).join("");
  const key=day+"-"+i;
  return`<div class="ex ${ss?"ss":""}"><div class="top"><img src="${IMG[day][i]}" alt=""><div><h3>${lab?`<span>${lab}</span>`:""}${name}</h3>
  <div class="meta">${n} × ${reps} · ${rest?"repos "+rest+" s":"sans repos"}${tempo?" · tempo "+tempo:""}${bp!==null?" · record "+r1(bp)+" "+S.unit:""}</div></div></div>
  ${sg?`<div class="tip">${sg}</div>`:""}
  <div class="cols"><span></span><span>Poids (${S.unit})</span><span>Reps</span><span></span></div>${rows}
  <div class="acts"><button data-act="copy" data-i="${i}">Copier les poids</button><button data-act="chart" data-i="${i}">📈 Progression</button></div>
  ${open[key]?`<div class="chart">${chart(pts(day,i),S.unit)}</div>`:""}
  <input class="note" type="text" placeholder="Note (réglage, sensation…)" value="${esc(S.notes[key]||"")}" data-note="${key}"></div>`}).join("");
 renderHist();renderBody();
}
function renderHist(){
 const h=S.hist.slice(-8).reverse();
 $("hist").innerHTML=h.length?h.map(x=>{const ix=S.hist.indexOf(x);const vol=Object.values(x.data||{}).flat().filter(s=>s.w&&s.r).length;
  return`<div class="hi"><button class="del" data-h="${ix}">${pend===ix?"Confirmer":"✕"}</button><b>${x.date}</b> · ${DAYS[x.day].name} · ${vol} séries${x.dur?" · "+fmt(x.dur):""}</div>`}).join(""):'<div class="hi">Rien pour l\'instant.</div>';
 const b=$("cb");b.style.display=S.hist.length?"block":"none";b.textContent=pend==="all"?"Confirmer l'effacement":"Effacer tout l'historique";
}
function renderBody(){
 const b=S.body;
 if(!b.length){$("bodyinfo").textContent="Aucune entrée pour l'instant.";$("bodychart").innerHTML="";return}
 const l=b[b.length-1],cw=conv(l.w,l.unit,S.unit);let d="";
 if(b.length>1){const p=b[b.length-2],df=cw-conv(p.w,p.unit,S.unit);d=` (${df>=0?"+":""}${r1(df)} depuis la dernière)`}
 $("bodyinfo").textContent="Dernier : "+r1(cw)+" "+S.unit+" le "+l.date+d;
 $("bodychart").innerHTML=chart(b.map(x=>({y:conv(x.w,x.unit,S.unit),d:String(x.date).slice(5)})),S.unit);
}

function startSess(){S.last=Date.now();if(!S.start)S.start=Date.now();save();tickSess()}
function tickSess(){$("sv").textContent=S.start?fmt(Date.now()-S.start):"00:00";$("sb").textContent=S.start?"Réinitialiser":"Démarrer la séance";checkIdle()}
function checkIdle(){const w=$("warn");if(S.start&&S.last&&Date.now()-S.last>IDLE){w.style.display="block";$("wm").textContent="Inactif depuis "+Math.round((Date.now()-S.last)/60000)+" min. Termine ta séance pour l'enregistrer."}else w.style.display="none"}
setInterval(tickSess,1000);document.addEventListener("visibilitychange",tickSess);
let tm=null;
let AC=null,ka=null;
function audioInit(){try{if(S.snd===false)return;try{navigator.audioSession&&(navigator.audioSession.type="ambient")}catch(e){}AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
function kaStop(){try{ka&&ka.pause()}catch(e){}}
function beep(){try{if(S.snd===false||!AC)return;AC.resume&&AC.resume();[0,.25,.5].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+d;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
let endAt=0,tf=null,goT=null;
function restTick(){const el=$("timer");if(!endAt)return;const r=Math.ceil((endAt-Date.now())/1000);
 if(r>0){el.style.display="block";el.textContent="Repos "+Math.floor(r/60)+":"+String(r%60).padStart(2,"0");return}
 clearInterval(tm);endAt=0;kaStop();beep();el.style.display="block";el.textContent="Go !";try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}clearTimeout(goT);goT=setTimeout(()=>el.style.display="none",2500)}
function startTimer(sec){clearInterval(tm);clearTimeout(goT);audioInit();endAt=Date.now()+sec*1000;const el=$("timer");restTick();tm=setInterval(restTick,500);el.onclick=()=>{clearInterval(tm);endAt=0;kaStop();el.style.display="none"}}
document.addEventListener("visibilitychange",restTick);window.addEventListener("pageshow",restTick);window.addEventListener("focus",restTick);
function big(t){let e=$("cheer");if(!e){e=document.createElement("div");e.id="cheer";e.className="cheer";document.body.appendChild(e)}e.textContent=t;e.classList.add("on");clearTimeout(big.t);big.t=setTimeout(()=>e.classList.remove("on"),3500)}
function nm(){return(S.name||"").trim()}
const M={

up:["🔥 Tu progresses, {n}, continue comme ça !","🔥 Plus lourd que la dernière fois, {n} ! Ça, c'est de la progression.","📈 {n}, la courbe monte. Garde ça en tête.","💥 Plus de poids, {n} ! Même la barre est surprise.","💪 Tu soulèves plus qu'avant, {n}. Les résultats suivent."],
first:["🚀 C'est parti, {n} ! Première série au compteur.","{n}, le plus dur c'est de commencer, et c'est fait !","Lancé, concentré, motivé 🔥 Continue, {n}.","Première série dans la poche, {n}. Les autres suivent."],
last:["🏁 Exercice bouclé, {n} ! Ça, c'est de la constance.","Exercice terminé, {n}. Tu peux dire « facile » à voix haute 😄","Bouclé ! Tes muscles te remercieront… demain, en grimaçant 😅","✅ Dernière série faite, {n}. Respire, tu l'as mérité."],
same:["Même poids, {n} : c'est de la constance. Vise une rep de plus 😉","Le poids n'a pas bougé, mais t'es encore là, {n}. C'est ça qui compte.","Solide, {n}. La prochaine fois, on tente un petit +2,5 👀"],
mid:["Bien joué, {n} 💪","Solide, {n}, continue !","{n}, ça, c'est du travail propre.","Tes muscles envoient un merci, {n} 🙏","Une de plus dans la poche, {n}.","{n}, ton futur toi te dit merci.","Pas mal du tout, {n} 🔥","Ça pousse fort, {n} !","Même le banc est impressionné, {n} 😏","{n}, tu fais ça comme un pro.","Respire, hydrate-toi, recommence 💧","Chaque rep compte, {n}.","Les haltères t'ont vu venir, {n} 😎","Tu construis quelque chose, {n} 🧱"],
legs:["Jour de jambes, {n}… demain, les escaliers seront ton ennemi 😅","Tes jambes tremblent ? C'est normal, {n}. C'est même bon signe.","{n}, tu fais ce que 80 % des gens sautent : le jour de jambes 🦵"]};
M.mid.push("Tiguidou, {n} ! 👌","T'es ben bon, {n} !","Lâche pas, {n}, t'es en feu 🔥","Pas pire pantoute, {n} 😎","Envoye, {n}, une autre de même !","Ça roule, {n} ! Continue de même.","Wow, {n}, c'est ben solide !","{n}, t'es une vraie bute 🦍");
M.first.push("Envoye, {n}, on part la machine ! 🚀");
M.last.push("Tiguidou ! Exercice terminé, {n} 👌","C'est faite, {n} ! Prends une gorgée d'eau pis r'pars 💧");
M.pr.push("🏆 Ayoye, {n}, nouveau record ! T'es malade !","🏆 Wow, {n}, record ! Y'a pas grand monde qui fait ça.");
M.up.push("🔥 Ayoye, plus lourd qu'avant, {n} ! T'es ben parti !","💪 {n}, ça monte pis ça s'arrête pas !");
M.same.push("Pareil comme la dernière fois, {n}. Une rep de plus pis c'est gagné 😉");
M.legs.push("Jambes, {n} ! Demain, les escaliers vont être raides 😅");
M.mid.push("{n}, les poids sont pas lourds, c'est toi qui es fort 😎","Les biceps ont lu ton message, {n} 📩","Ça brûle ? C'est juste le muscle qui te dit bonjour 👋","Une série à la fois, {n}. T'es pas pressé pis t'avances pareil.","T'as pas besoin de motivation, {n}, t'as de la discipline 💪","Les haltères pleurent un peu, {n}, mais toi tu souris 😁","Beau travail, {n} ! Le café de tantôt est fier de toi ☕","{n}, ta forme s'en vient, pis ça parait 👀","Pas de raccourci, pas de problème. Ben joué, {n} !","{n}, t'es en train de devenir ton propre héros 🦸","Ouf, {n}, les poids ont eu leur leçon 😂","Ça fait du bien, hein ? Continue, {n} !","Wô, {n} ! Ça sent la protéine ici 🍗","T'es tough, {n}. Point final.","Un petit pas pour l'homme, une grosse série pour toi, {n} 🚀","La barre a eu peur, {n}. C'est confirmé 😆","Chapeau, {n} ! Même le miroir applaudit 👏","Y'en a qui regardent leur téléphone. Toi tu soulèves, {n} 📱","{n}, c'est pas de la magie, c'est de la constance ✨","Ton moi de demain te remercie déjà 🙌");
M.mid.push("Ouf, ça, c'est pas pour les mous ! 💪","Ouf, ça, c'est pas pour les amateurs, {n}.","Ouf, {n}, même les gros poids ont reculé d'un pas 😤");
const BG={};
function pick(key,L){let b=BG[key];if(!b||!b.length){b=BG[key]=L.map((_,i)=>i).sort(()=>Math.random()-.5);const l=BG[key+"_l"];if(l!==undefined&&b.length>1&&b[b.length-1]===l){const t=b[0];b[0]=b[b.length-1];b[b.length-1]=t}}const i=b.pop();BG[key+"_l"]=i;return L[i]}
function fm(t){const n=nm();if(n)return t.replace(/\{n\}/g,n);t=t.replace(/,\s*\{n\}/g,"").replace(/\{n\},\s*/g,"").replace(/\s?\{n\}/g,"").trim();return t.charAt(0).toUpperCase()+t.slice(1)}
function cheer(i,k,s){const nS=DAYS[day].ex[i][2];let key,L;
 if(isPR(i,s)){key="pr";L=M.pr}else if(isUp(i,k,s)){key="up";L=M.up}
 else if(k===nS-1){key="last";L=M.last}else if(k===0){key="first";L=M.first}
 else if(isRed(i,k,s)){key="same";L=M.same}
 else{key="mid"+day;L=day===2?M.mid.concat(M.legs):M.mid}
 big(fm(pick(key,L)))}
function afterDone(i,k,s){const r=DAYS[day].ex[i][4];if(r)startTimer(r);cheer(i,k,s)}
function copyW(i){const lf=lastFor(day,i);if(!lf)return;const sets=getSets(day,i,DAYS[day].ex[i][2]);sets.forEach((s,k)=>{const p=lf.sets[k];if(!s.w&&p&&p.w){s.w=String(r1(conv(p.w,lf.h.unit,S.unit)));s.c=true}})}

document.addEventListener("click",e=>{
 const t=e.target;
 if(t.dataset.d!==undefined){day=+t.dataset.d;render();window.scrollTo(0,0)}
 else if(t.id==="sb"){if(S.start){S.start=null}else{S.start=Date.now();S.last=Date.now()}save();tickSess()}
 else if(t.dataset.h!==undefined){const ix=+t.dataset.h;if(pend===ix){S.hist.splice(ix,1);pend=null;save();render();toast("Séance supprimée")}else{pend=ix;renderHist();setTimeout(()=>{if(pend===ix){pend=null;renderHist()}},4000)}}
 else if(t.id==="cb"){if(pend==="all"){S.hist=[];pend=null;save();render();toast("Historique effacé")}else{pend="all";renderHist();setTimeout(()=>{if(pend==="all"){pend=null;renderHist()}},4000)}}
 else if(t.classList.contains("chk")){startSess();const i=t.dataset.i,k=t.dataset.k;const s=S.cur[day][i][k];s.done=!s.done;save();t.classList.toggle("on",s.done);t.closest(".row").classList.toggle("ok",s.done);if(s.done)afterDone(+i,+k,s)}
 else if(t.dataset.act==="copy"){startSess();copyW(+t.dataset.i);save();render()}
 else if(t.dataset.act==="chart"){const key=day+"-"+t.dataset.i;open[key]=!open[key];render()}
 else if(t.id==="gcopy"){startSess();DAYS[day].ex.forEach((e2,i)=>copyW(i));save();render();toast("Poids repris — à toi de jouer")}
 else if(t.id==="rt"){S.red=S.red===false;save();render()}
 else if(t.id==="sn"){S.snd=S.snd===false;save();render()}
 else if(t.id==="badd"){const v=$("bw").value;if(v===""||isNaN(+v)||+v<=0){toast("Entre un poids valide");return}S.body.push({ts:Date.now(),date:new Date().toLocaleDateString("fr-CA"),w:+v,unit:S.unit});$("bw").value="";save();renderBody();toast("Poids ajouté")}
 else if(t.id==="bundo"){if(S.body.length){S.body.pop();save();renderBody();toast("Dernière entrée annulée")}}
 else if(t.id==="bexpall"){const txt=JSON.stringify({v:1,unit:S.unit,hist:S.hist,notes:S.notes,body:S.body});const ta=$("bk");ta.value=txt;ta.focus();ta.select();try{navigator.clipboard.writeText(txt).then(()=>toast("Copié — colle-le dans une note")).catch(()=>toast("Sélectionne et copie le texte"))}catch(x){toast("Sélectionne et copie le texte")}}
 else if(t.id==="bimp"){
  if(t.dataset.arm!=="1"){let o;try{o=JSON.parse($("bk").value)}catch(x){toast("Texte invalide");return}if(!o||!Array.isArray(o.hist)){toast("Texte invalide");return}t.dataset.arm="1";t.textContent="Confirmer (remplace tout)";setTimeout(()=>{t.dataset.arm="";t.textContent="Importer"},4000)}
  else{let o;try{o=JSON.parse($("bk").value)}catch(x){return}S.hist=o.hist;S.notes=o.notes||{};S.body=o.body||[];if(o.unit)S.unit=o.unit;t.dataset.arm="";t.textContent="Importer";save();render();toast("Sauvegarde restaurée")}}
 else if(t.id==="ovx"){$("ov").style.display="none"}
});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="nm"){S.name=t.value;save();return}
 if(t.dataset.note!==undefined){S.notes[t.dataset.note]=t.value;save();return}
 if(!t.dataset.f)return;
 startSess();const i=+t.dataset.i,k=+t.dataset.k;const s=S.cur[day][i][k];s[t.dataset.f]=t.value;if(t.dataset.f==="w")s.c=false;
 const row=t.closest(".row");const pr=isPR(i,s);row.classList.toggle("red",isRed(i,k,s));row.classList.toggle("pr",pr);row.querySelector(".n").textContent=pr?"🏆":k+1;
 const full=s.w!==""&&s.r!=="";if(full!==s.done){s.done=full;row.querySelector(".chk").classList.toggle("on",full);if(full)afterDone(i,k,s)}
 row.classList.toggle("ok",full);clearTimeout(window._bt);if(full)window._bt=setTimeout(()=>{if(document.activeElement===t)t.blur()},1200);
 save()});
$("ulb").onclick=()=>{S.unit="lb";save();render()};
$("ukg").onclick=()=>{S.unit="kg";save();render()};
$("bend").onclick=()=>{
 const d=S.cur[day]||{};const any=Object.values(d).flat().some(s=>s.w&&s.r);
 if(!any){toast("Entre au moins une série");return}
 let sets=0,vol=0,prs=0;
 DAYS[day].ex.forEach((e,i)=>{(d[i]||[]).forEach(s=>{if(s.w&&s.r){sets++;vol+=conv(s.w,S.unit,"lb")*(+s.r);if(isPR(i,s))prs++}})});
 const prev=S.hist.filter(h=>h.day===day).pop();let pv=0;if(prev)Object.values(prev.data||{}).flat().forEach(s=>{if(s.w&&s.r)pv+=conv(s.w,prev.unit,"lb")*(+s.r)});
 const dur=S.start?(idleEnd||Date.now())-S.start:0;idleEnd=0;
 S.hist.push({dur,day,ts:Date.now(),date:new Date().toLocaleDateString("fr-CA"),unit:S.unit,data:JSON.parse(JSON.stringify(d))});
 S.cur[day]={};S.start=null;save();tickSess();render();window.scrollTo(0,0);
 const vu=S.unit==="lb"?vol:vol/2.20462;let cmp="";if(pv>0){const pc=Math.round((vol-pv)/pv*100);cmp=pc>0?` (+${pc} % vs la dernière fois 🔥)`:pc<0?` (${pc} % vs la dernière fois — chaque séance compte)`:" (identique à la dernière fois)"}
 $("ovh").textContent="Séance terminée 🎉";
 $("ovb").innerHTML=`<p>${sets} séries${dur?" en "+fmt(dur):""}</p><p>Volume : ${Math.round(vu).toLocaleString("fr-CA")} ${S.unit}${cmp}</p>${prs?`<p>🏆 ${prs} record${prs>1?"s":""} battu${prs>1?"s":""} !</p>`:""}<p><b>Tu t'es présenté, et c'est ce qui compte. Fier de toi${nm()?", "+esc(nm()):""} !</b></p>`;
 $("ov").style.display="flex"};
$("bexp").onclick=()=>{
 const h=S.hist.filter(x=>x.day===day).slice(-1)[0]||null;let txt;
 if(h){txt=DAYS[day].name+" — "+h.date+" ("+h.unit+")\n"+DAYS[day].ex.map((e,i)=>{const s=((h.data||{})[i]||[]).filter(x=>x.w||x.r);return s.length?e[1]+": "+s.map(x=>(x.w||"?")+"×"+(x.r||"?")).join(", "):null}).filter(Boolean).join("\n")}
 else txt="Aucune séance enregistrée pour ce jour.";
 const ta=$("exp");ta.style.display="block";ta.value=txt;ta.focus();ta.select();
 try{navigator.clipboard.writeText(txt).then(()=>toast("Copié")).catch(()=>toast("Sélectionne et copie le texte"))}catch(x){toast("Sélectionne et copie le texte")}
 ta.scrollIntoView({block:"center"})};
$("wend").onclick=()=>{idleEnd=S.last||0;$("bend").onclick();S.last=Date.now();save();tickSess()};
$("wgo").onclick=()=>{S.last=Date.now();save();tickSess()};
render();tickSess();
</script>
